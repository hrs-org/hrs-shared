name: CD - Publish NuGet Package

on:
  push:
    tags:
      - "v*"

jobs:
  publish:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore HRS.Shared.Core/HRS.Shared.Core.csproj

      - name: Build
        run: dotnet build HRS.Shared.Core/HRS.Shared.Core.csproj --configuration Release --no-restore

      - name: Pack
        run: dotnet pack HRS.Shared.Core/HRS.Shared.Core.csproj --configuration Release --no-build -o ./nupkg

      - name: Publish to GitHub Packages
        run: |
          dotnet nuget push "./nupkg/*.nupkg" \
          --source "https://nuget.pkg.github.com/hrs-org/index.json" \
          --api-key ${{ secrets.GITHUB_TOKEN }}
