name: CD - Publish NuGet Package

on:
  push:
    tags:
      - "v*"

jobs:
  publish:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Resolve package version from tag
        run: echo "PACKAGE_VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_ENV

      - name: Update version.json from tag
        run: |
          sed -E "s/\"version\": \"[^\"]+\"/\"version\": \"$PACKAGE_VERSION\"/" version.json > version.json.tmp
          mv version.json.tmp version.json
          cat version.json

      - name: Show version context
        run: |
          echo "GITHUB_REF=$GITHUB_REF"
          echo "GITHUB_REF_NAME=$GITHUB_REF_NAME"
          echo "PACKAGE_VERSION=$PACKAGE_VERSION"

      - name: Clean package output
        run: |
          rm -rf ./nupkg
          mkdir -p ./nupkg

      - name: Restore
        run: dotnet restore HRS.Shared.Core/HRS.Shared.Core.csproj

      - name: Build
        run: dotnet build HRS.Shared.Core/HRS.Shared.Core.csproj --configuration Release --no-restore /p:Version=$PACKAGE_VERSION /p:PackageVersion=$PACKAGE_VERSION

      - name: Pack
        run: dotnet pack HRS.Shared.Core/HRS.Shared.Core.csproj --configuration Release --no-build -o ./nupkg /p:Version=$PACKAGE_VERSION /p:PackageVersion=$PACKAGE_VERSION /p:AssemblyVersion=$PACKAGE_VERSION /p:FileVersion=$PACKAGE_VERSION /p:InformationalVersion=$PACKAGE_VERSION

      - name: Verify generated package
        run: ls -la ./nupkg

      - name: Publish to GitHub Packages
        run: |
          dotnet nuget push "./nupkg/*.nupkg" \
          --source "https://nuget.pkg.github.com/hrs-org/index.json" \
          --api-key ${{ secrets.GITHUB_TOKEN }} \
          --skip-duplicate
