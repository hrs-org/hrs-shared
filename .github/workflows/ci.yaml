name: CI - Build Shared Library

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore dependencies
        run: dotnet restore HRS.Shared.Core/HRS.Shared.Core.csproj

      - name: Build project
        run: dotnet build HRS.Shared.Core/HRS.Shared.Core.csproj --configuration Release --no-restore
